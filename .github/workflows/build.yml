name: Build WinStyler

# Cada push a main/master compila WinStyler.exe (con su icono y el módulo wstb.dll
# compilado desde native/wstb.cpp) y publica una release nueva marcada como "Latest".
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Instalar dependencias de compilación
        run: pip install -r requirements-build.txt

      - name: Compilar módulo nativo (native/wstb.dll)
        shell: cmd
        run: call native\compilar_dll.bat

      - name: Compilar exe portable (solo deja WinStyler.exe)
        shell: cmd
        run: call compilar.bat

      - name: Guardar exe como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: WinStyler
          path: WinStyler.exe

      - name: Actualizar release "latest" con el exe nuevo
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Una sola release que se renueva en cada push: el enlace de descarga no cambia
          # (https://github.com/<usuario>/<repo>/releases/latest/download/WinStyler.exe).
          NOTES="Build ${GITHUB_RUN_NUMBER} · commit ${GITHUB_SHA::7}: $(git log -1 --pretty=%s)"
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest WinStyler.exe --title "WinStyler (última versión)" \
            --notes "$NOTES" --target "$GITHUB_SHA" --latest
