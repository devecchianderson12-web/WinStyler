name: Build WinStyler

# Cada push a main/master compila WinStyler.exe (con su icono y el módulo wstb.dll
# compilado desde native/wstb.cpp) y publica una release nueva marcada como "Latest".
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar PyInstaller
        run: pip install pyinstaller

      - name: Compilar módulo nativo (native/wstb.dll)
        shell: cmd
        run: call native\compilar_dll.bat

      - name: Compilar exe portable (solo deja WinStyler.exe)
        shell: cmd
        run: call compilar.bat

      - name: Guardar exe como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: WinStyler
          path: WinStyler.exe

      - name: Publicar release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v1.${GITHUB_RUN_NUMBER}"
          gh release create "$VERSION" WinStyler.exe \
            --title "WinStyler $VERSION" \
            --notes "Compilado automáticamente desde el commit ${GITHUB_SHA::7}: $(git log -1 --pretty=%s)" \
            --target "$GITHUB_SHA" \
            --latest
